# Ground0: start the launcher through a guard that falls back to the stock
# launcher when Ground0 is switched off or keeps crashing.
[Service]
ExecStart=
ExecStart=/usr/lib/ground0/ground0-run
Environment=GROUND0_FONT_DIR=/usr/share/ground0/fonts
Environment=GROUND0_HELPER=/usr/share/ground0/ground0-helper.py
