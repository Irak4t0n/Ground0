# Ground0: MediaTek USB Wi-Fi adapters (mt76x0u / mt76x2u, e.g. Panda PAU0B,
# many AC600 dongles) reset themselves on the Cardputer Zero's USB controller
# after a few seconds of traffic ("timed out waiting for pending tx"). Turning
# off USB scatter-gather for the driver stops that. Only these adapters are
# affected. To undo, override it in /etc/modprobe.d/ with disable_usb_sg=0.
options mt76_usb disable_usb_sg=1
