# Ground0: Wi-Fi power saving off. With it on, the built-in radio of the
# Cardputer Zero misses handshakes while the device sits idle, most of all when
# it hops between access points that share one name. Costs a little battery.
# To turn power saving back on, put "wifi.powersave = 3" in a file of your own
# under /etc/NetworkManager/conf.d/.
[connection-ground0-wifi-powersave]
match-device=type:wifi
wifi.powersave = 2
